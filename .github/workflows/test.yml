name: Tests

on:
  push:
    branches: [main]
  # No base-branch filter: a PR stacked on a feature branch must be gated too.
  # Filtering on `branches` here matches the PR base, which silently skipped this
  # job for every stacked PR while the check rollup still read green (issue #215).
  pull_request:
  # Called by release.yml so the release gate IS this workflow rather than a
  # copy of it (issue #353). A duplicated gate drifts, and the copy that drifts
  # is always the one guarding production.
  workflow_call:

# Neither job writes anything — no comments, no releases, no package pushes.
# Least privilege rather than the repository default, which on many repos is
# still read/write.
permissions:
  contents: read

jobs:
  # The gate that was missing: five real errors (two set-state-in-effect, three
  # react-refresh export splits) reached main because nothing in CI ran eslint —
  # the same class as the absent-test-job gap issue #216 closed.
  #
  # Its OWN job, deliberately, and not a step in `test`: a step ordered before
  # the suites would let a one-line style regression short-circuit them and
  # erase the test signal entirely, which is the failure mode #215/#216 were
  # about. Parallel means a lint error and a test failure are always reported
  # together. `--max-warnings` stays unset so pre-existing warnings (apps/web
  # carries seven `react-hooks/exhaustive-deps`) stay visible without blocking.
  #
  # SCOPE, precisely: six projects run a real eslint — the three apps
  # (`apps/web`, `apps/study-web`, `apps/do-web`), `packages/shared-ui` (same
  # React config as the apps), and both functions packages (`apps/functions`,
  # `apps/study-functions`, on a node/TS config with no React rules, covering
  # their `.ts` sources AND their committed `.cjs` seed/backfill scripts).
  # #348 replaced the stub `lint` scripts that used to echo and exit 0. Still
  # NOT linted: the four pure-TS `packages/*-core` libraries and
  # `packages/shared-functions`, which have no `lint` script at all.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

  # The same gap as `lint` above, one rung over: `pnpm -r typecheck` was green
  # repo-wide but NOTHING in .github/workflows ran it, so it was a local gate
  # only and a PR breaking a type in any package merged green (issue #378).
  # That also meant the tsconfig.test.json pair #373 added to the functions
  # packages — the thing that gets their vitest files type-checked at all —
  # could not actually be enforced.
  #
  # Its OWN job, parallel to `lint` and `test`, for the reason spelled out on
  # the lint job (#341): a type gate ordered ahead of the suites erases their
  # signal the moment it fails, which is the failure mode #215/#216 closed.
  #
  # No build step: every packages/* manifest maps its `types` export condition
  # to `src/*.ts`, so `tsc` reads sources directly and a fresh checkout needs no
  # `dist`.
  #
  # That held here only by accident until #406. TypeScript matches export
  # condition KEYS IN ORDER, and `types` used to be listed AFTER `require`, so
  # a CJS consumer matched `require` → `dist/*.d.ts` and fell through to
  # `types` → `src` ONLY because this job's checkout has no `dist` to match. A
  # developer with one got the opposite answer — which is why local runs and
  # this job could disagree in both directions, inventing errors that were not
  # real and hiding ones that were. `types` is now listed first, so source is
  # the answer regardless of what is on disk and this job no longer depends on
  # being clean. `release-workflow.test.ts` pins the ordering.
  #
  # SCOPE, precisely: every workspace project now defines `typecheck` (`tests`
  # had no such script until this change, so `pnpm -r` silently skipped the
  # integration suite entirely; release-workflow.test.ts pins that they all
  # still do). Since #393/#411 the three web apps also run a SECOND pass —
  # `tsc --noEmit -p tsconfig.test.json`, the same two-pass form #373 gave the
  # functions packages — so the 246 test files their tsconfig.app.json excludes
  # are covered here too, along with each web app's vitest.setup.ts. Each web
  # app's vitest.config.ts is now checked as well, but by the FIRST pass —
  # tsconfig.node.json lists it beside vite.config.ts, which is the faithful
  # environment for a file that runs in Node (no DOM lib). Two gaps remain,
  # neither a regression here:
  #   - ALL the root-level TypeScript outside any workspace package, which no
  #     tsconfig covers and `pnpm -r` skips: scripts/__tests__/ (this
  #     workflow's own pins among them), tests-e2e/, and the root configs
  #     playwright.config.ts and vitest.config.ts.
  #   - the vitest.config.ts INSIDE each of the other seven workspace packages
  #     that have one: apps/{functions,study-functions} and
  #     packages/{shared-core,shared-functions,sit-core,study-core,do-core}
  #     (shared-ui has none). Being inside a package does not help — every base
  #     config includes only `src`, so nothing lists them. The three web apps
  #     closed this for themselves by naming vitest.config.ts in their
  #     tsconfig.node.json (#411). Those seven have no node-side config to
  #     name it in, so closing them means picking a home deliberately rather
  #     than copying this one line.
  # `scripts/__tests__/release-workflow.test.ts` pins the parts of this job
  # whose loss would be silent, including that every workspace package keeps a
  # `typecheck` script — the gap `tests` was in until now.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit tests — fast, no emulators needed
      - name: Run unit tests
        run: pnpm test:unit

      # Setup for integration tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' build

      - name: Build Cloud Functions
        run: |
          pnpm build:functions
          pnpm build:study-functions

      # Integration tests — run inside emulator lifecycle
      - name: Run integration tests
        # --only: the hosting emulator would otherwise auto-start (hosting is
        # configured with named targets that don't resolve under demo-test).
        # ADMIN_CONFIG_TTL_MS=0: the admin-config effect pins (issue #250)
        # need writes visible to the next callable invocation; with the 60s
        # default an earlier suite's cached read hides them.
        run: pnpm exec firebase emulators:exec --only auth,functions,firestore,storage --project demo-test 'pnpm test:integration'
        env:
          ADMIN_CONFIG_TTL_MS: '0'

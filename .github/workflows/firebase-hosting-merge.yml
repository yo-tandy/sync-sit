name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# Serialize merge deploys (2026-08-28 incident): five PRs merged in quick
# succession each launched a full functions deploy in parallel and the
# Cloud Functions API returned 429 "Per project mutation requests" quota
# exceeded, leaving prod one merge behind. One deploy at a time; a queued
# run always deploys the branch tip, and GitHub keeps only the newest
# pending run per group, so intermediate pushes coalesce. cancel-in-progress
# stays FALSE deliberately -- never kill a prod deploy mid-flight.
concurrency:
  group: firebase-deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (Corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build web (Firebase config is public/client-side, not secret)
      - name: Build web
        run: pnpm --filter web build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDyYp2GQdH-8h16B6XNx3sdI8tdDcY1tEw
          VITE_FIREBASE_AUTH_DOMAIN: sync-sit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: sync-sit
          VITE_FIREBASE_STORAGE_BUCKET: sync-sit.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '652129443234'
          VITE_FIREBASE_APP_ID: '1:652129443234:web:b1addb8ca9204154aba6fb'
          VITE_FIREBASE_VAPID_KEY: BHhR2VRnGyiMruB55skkISGURA5MqVat0lzGRtzfnfHJ6IlgOs8sZDKy25k0nitxIlmLToaUWr1YfX5KBuxg1yo

      # Build study-web (second hosting target: site sync-study-app). Same
      # project-level Firebase config; reuses the sit web-app id for now — a
      # dedicated app registration for sync-study is a follow-up.
      - name: Build study-web
        run: |
          pnpm --filter @ejm/shared-core build
          pnpm --filter @ejm/study-core build
          pnpm --filter study-web build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDyYp2GQdH-8h16B6XNx3sdI8tdDcY1tEw
          VITE_FIREBASE_AUTH_DOMAIN: sync-sit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: sync-sit
          VITE_FIREBASE_STORAGE_BUCKET: sync-sit.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '652129443234'
          VITE_FIREBASE_APP_ID: '1:652129443234:web:b1addb8ca9204154aba6fb'
          # Same project-wide public VAPID key as the sit build step above —
          # study-web push (issue #168 Phase 1) needs it at build time.
          VITE_FIREBASE_VAPID_KEY: BHhR2VRnGyiMruB55skkISGURA5MqVat0lzGRtzfnfHJ6IlgOs8sZDKy25k0nitxIlmLToaUWr1YfX5KBuxg1yo

      # Build do-web (third hosting target: site sync-do-app, plan §3.1). Same
      # project-level Firebase config; reuses the sit web-app id like study-web
      # does — a dedicated app registration for sync-do is a follow-up. No
      # VAPID key: the do shell ships no push (that arrives with sync-do's
      # notifications PR).
      - name: Build do-web
        run: |
          pnpm --filter @ejm/shared-core build
          pnpm --filter @ejm/do-core build
          pnpm --filter do-web build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDyYp2GQdH-8h16B6XNx3sdI8tdDcY1tEw
          VITE_FIREBASE_AUTH_DOMAIN: sync-sit.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: sync-sit
          VITE_FIREBASE_STORAGE_BUCKET: sync-sit.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '652129443234'
          VITE_FIREBASE_APP_ID: '1:652129443234:web:b1addb8ca9204154aba6fb'

      # Authenticate to Google Cloud via Workload Identity Federation
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: sync-sit
          workload_identity_provider: projects/652129443234/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-action-1196270164@sync-sit.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      # Deploy Firestore rules + indexes FIRST: new collections' rules must be
      # live before hosting ships UI that reads them. Historically this step
      # was missing — hosting+functions auto-deployed on merge while rules and
      # indexes silently went stale in prod.
      - name: Deploy Firestore rules and indexes
        run: pnpm exec firebase deploy --only firestore --project sync-sit --non-interactive

      # Storage rules auto-deploy (issue #282), beside its Firestore sibling
      # per issue #286: rules ship BEFORE the hosting/functions that depend on
      # them. This step started life LAST as a hard-fail probe (PR #283 round
      # 2) because the WIF SA's storage-side grant could not be verified from
      # CI ahead of the first run -- and that caution was vindicated: the
      # first runs failed 403 on `firebasestorage.defaultBucket.get`, a
      # permission `roles/firebaserules.admin` does not carry. The SA now
      # holds `roles/firebasestorage.admin` (granted 2026-08-28, issue #286),
      # and main's rules were released by an owner-credential deploy the same
      # day, so a failure here is a regression, not a first-contact surprise.
      - name: Deploy Storage rules
        run: pnpm exec firebase deploy --only storage --project sync-sit --non-interactive

      # Deploy hosting (uses ADC from auth step)
      - name: Deploy Hosting
        run: pnpm exec firebase deploy --only hosting --project sync-sit --non-interactive

      # Bundle shared for functions deploy
      - run: node scripts/bundle-shared-for-deploy.js

      # Build functions
      - run: cd apps/functions && npx tsc

      # Deploy functions (uses ADC from auth step). One retry after a
      # 2-minute backoff: the mutation-request quota that failed the
      # 2026-08-28 run is a short-window rate limit, so a single spaced
      # retry recovers residual pressure that serialization cannot (e.g. a
      # manual console deploy running concurrently).
      - name: Deploy Cloud Functions
        run: |
          if ! pnpm exec firebase deploy --only functions --project sync-sit --non-interactive --force; then
            echo "functions deploy failed -- backing off 120s and retrying once"
            sleep 120
            pnpm exec firebase deploy --only functions --project sync-sit --non-interactive --force
          fi

      # Unbundle shared
      - run: node scripts/unbundle-shared-after-deploy.js
